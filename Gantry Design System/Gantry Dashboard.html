<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantry — Dashboard</title>
<link rel="stylesheet" href="assets/gantry.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #root { height: 100vh; }

  .shell { display: flex; height: 100vh; background: var(--bg-0); }

  /* ---------- Sidebar (220px fixed) ---------- */
  .sidebar { width: 220px; flex: none; background: var(--bg-0); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
  .side-logo { padding: 18px var(--sp-4) 14px; }
  .logo-tile { width: 30px; height: 30px; border-radius: 5px; background: #15191F; display: grid; place-items: center; border: 1px solid var(--border); }

  .proj-switch { position: relative; margin: 0 12px 8px; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--r-2); display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: var(--bg-1); transition: border-color .18s; }
  .proj-switch:hover { border-color: var(--border-strong); }
  .proj-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--accent); flex: none; box-shadow: 0 0 8px rgba(0,229,153,0.6); }
  .proj-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-env { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .proj-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: var(--r-2); box-shadow: var(--sh-pop); padding: 4px; z-index: var(--z-dropdown); }
  .proj-opt { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; border-radius: var(--r-1); cursor: pointer; color: var(--text-1); }
  .proj-opt:hover { background: var(--bg-3); }
  .proj-opt.active { color: var(--text-0); }

  .side-nav { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .nav-group { margin-bottom: 18px; }
  .nav-grouplabel { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 9px; }
  .nav-grouplabel::before { content: '// '; color: var(--text-4); }
  .nav-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--r-1); font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); background: transparent; border: none; cursor: pointer; text-align: left; transition: background .15s, color .15s; position: relative; }
  .nav-ix { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); flex: none; }
  .nav-i:hover { background: rgba(255,255,255,0.04); color: var(--text-0); }
  .nav-i.active { background: linear-gradient(90deg, rgba(0,229,153,0.07), transparent); color: var(--text-0); }
  .nav-i.active::before { content: ''; position: absolute; left: -12px; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .nav-i.active .nav-ix { color: var(--accent); }
  .nav-i svg { opacity: 0.92; flex: none; }
  .nav-badge { margin-left: auto; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--error-soft); color: var(--error); border-radius: 999px; padding: 1px 7px; }

  .side-foot { padding: 12px; border-top: 1px solid var(--border); }
  .usage-mini { padding: 10px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-2); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: var(--z-sticky); height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--hair); background: rgba(11,15,20,0.82); backdrop-filter: blur(14px); }
  .topbar-title { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: 0.01em; margin: 0; }
  .tb-ticks { position: absolute; left: 28px; right: 28px; bottom: 0; height: 8px; display: flex; justify-content: space-between; pointer-events: none; }
  .tb-ticks i { width: 1px; height: 4px; background: rgba(255,255,255,0.14); align-self: flex-end; }
  .tb-ticks i:nth-child(5n+1) { height: 8px; background: rgba(255,255,255,0.26); }

  .search-box { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-2); width: 240px; }
  .search-box input { background: none; border: none; outline: none; color: var(--text-0); font-size: 13px; flex: 1; min-width: 0; font-family: var(--font-sans); }
  .search-box input::placeholder { color: var(--text-3); }
  .kbd { font-size: 11px; color: var(--text-3); border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; }

  .date-menu { position: absolute; top: calc(100% + 6px); right: 0; width: 180px; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: var(--r-2); box-shadow: var(--sh-pop); padding: 4px; z-index: var(--z-dropdown); }
  .date-opt { display: flex; align-items: center; padding: 8px 10px; font-size: 13px; border-radius: var(--r-1); cursor: pointer; color: var(--text-1); }
  .date-opt:hover { background: var(--bg-3); }
  .date-opt.active { color: var(--text-0); }

  .content { flex: 1; overflow-y: auto; padding: 28px; }
  .page { display: flex; flex-direction: column; gap: 16px; max-width: 1240px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

  /* ---------- bars ---------- */
  .bar-track { height: 7px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 7px; border-radius: 999px; transition: width .5s cubic-bezier(0.22,0.61,0.36,1); }
  .vchip { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* ---------- MODEL ADVISOR ---------- */
  .advisor { position: relative; background: var(--bg-1); border: 1px solid var(--hair); border-radius: var(--r-3); padding: 22px 24px; }
  .advisor-glow { display: none; }
  .advisor-head { display: flex; align-items: flex-start; justify-content: space-between; position: relative; }
  .advisor-ic { width: 34px; height: 34px; border-radius: var(--r-1); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; border: 1px solid var(--accent-line); flex: none; }
  .advisor-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: 0.01em; white-space: nowrap; }
  .advisor-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  .advisor-chips { display: flex; gap: 8px; margin: 18px 0 20px; flex-wrap: wrap; position: relative; }
  .fchip { display: flex; align-items: center; gap: 10px; padding: 7px 11px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-2); cursor: pointer; font-size: 13px; color: var(--text-2); transition: all .15s; white-space: nowrap; }
  .fchip:hover { border-color: var(--border-strong); color: var(--text-0); }
  .fchip.active { background: var(--bg-2); border-color: var(--accent-line); color: var(--text-0); }
  .fchip-save { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent); }

  .advisor-body { display: grid; grid-template-columns: 300px 1fr; gap: 28px; position: relative; }
  .advisor-meta { display: flex; flex-direction: column; gap: 9px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .am-row { display: flex; align-items: center; justify-content: space-between; }
  .am-k { font-size: 13px; color: var(--text-3); }
  .am-v { font-size: 13px; color: var(--text-0); font-weight: 500; white-space: nowrap; }

  .savings-block { padding: 16px 0; }
  .savings-num { font-family: var(--font-mono); font-size: 44px; font-weight: 600; letter-spacing: -0.03em; color: var(--accent); line-height: 1; margin: 8px 0 8px; font-variant-numeric: tabular-nums; }
  .savings-foot { font-size: 13px; }

  .advisor-right { padding-left: 28px; border-left: 1px solid var(--border); }
  .bar-row { display: grid; grid-template-columns: 1fr; gap: 7px; padding: 11px 0; }
  .bar-row + .bar-row { border-top: 1px dashed var(--border); }
  .bar-label { display: flex; align-items: center; gap: 8px; }
  .bar-model { font-family: var(--font-display); font-size: 14px; font-weight: 500; color: var(--text-0); white-space: nowrap; }
  .tagpill { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--bg-2); color: var(--text-3); border: 1px solid var(--border); }
  .tagpill.rec { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
  .bar-row { grid-template-columns: 240px 1fr 78px 46px; align-items: center; gap: 12px; }
  .bar-cost { font-size: 13px; text-align: right; }
  .bar-eval { font-size: 12px; color: var(--text-3); text-align: right; }
  .advisor-disclaimer { font-size: 12px; line-height: 1.55; color: var(--text-3); margin: 16px 0 0; max-width: 560px; }

  /* ---------- alerts page ---------- */
  .alert-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
  .alert-ic { width: 34px; height: 34px; border-radius: var(--r-1); display: grid; place-items: center; flex: none; }
  .stat-label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); }
  .stat-value { font-family: var(--font-mono); }

  /* ---------- toast ---------- */
  .toast-host { position: fixed; bottom: 24px; right: 24px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 12px; }
  .toast { display: flex; gap: 12px; padding: 14px 16px; width: 380px; background: var(--bg-2); border: 1px solid var(--border-strong); border-left: 3px solid var(--error); border-radius: var(--r-2); box-shadow: var(--sh-3); animation: toast-in .32s cubic-bezier(0.22,0.61,0.36,1); }
  .toast.ok { border-left-color: var(--accent); }
  .toast-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--error-soft); color: var(--error); }
  .toast.ok .toast-ic { background: var(--accent-soft); color: var(--accent); }
  .toast-title { font-size: 14px; font-weight: 600; }
  .toast-body { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .toast-x { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 2px; align-self: flex-start; }
  .toast-x:hover { color: var(--text-0); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  /* ---------- switch ---------- */
  .switch { width: 40px; height: 23px; border-radius: 999px; background: var(--bg-3); position: relative; cursor: pointer; transition: background .18s; flex: none; }
  .switch.on { background: var(--accent); }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 999px; background: #fff; transition: transform .18s; }
  .switch.on .knob { transform: translateX(17px); }

  @media (max-width: 1080px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .content-grid { grid-template-columns: 1fr; } .advisor-body { grid-template-columns: 1fr; } .advisor-right { border-left: none; padding-left: 0; border-top: 1px solid var(--border); padding-top: 20px; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="assets/dash-shared.jsx"></script>
<script type="text/babel" src="assets/dash-views.jsx"></script>
<script type="text/babel" src="assets/dash-pages.jsx"></script>
<script type="text/babel" src="assets/dash-app.jsx"></script>
</body>
</html>
